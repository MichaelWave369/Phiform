name: PhiForm CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install

      - name: Bridge + SF3D adapter contract
        run: npm run contract

      - name: Edit graph contract
        run: npm run graph:contract

      - name: Agent command contract
        run: npm run agent:contract

      - name: Typecheck
        run: npm run check

      - name: Build
        run: npm run build
